name: Test Firefox Installer

on:
  workflow_dispatch:
    inputs:
      browser-version:
        description: Firefox version to install
        required: false
        type: string
        default: 'latest'
  workflow_call:
    inputs:
      browser-version:
        description: Firefox version to install
        required: false
        type: string
        default: 'latest'

jobs:
  bazel:
    name: Test Firefox Installer
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Setup Firefox
        uses: ali-security/setup-browser@main
        with:
          browser: firefox
          version: ${{ inputs.browser-version || 'latest' }}

      - name: Install Firefox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-glib-1-2

      - name: Verify Firefox Installation
        run: |
          firefox --version
          echo "Firefox installed successfully!"

