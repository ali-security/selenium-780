name: CI - Python

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: Build
    uses: ./.github/workflows/bazel.yml
    with:
      name: Build
      cache-key: py-build
      run: bazel build //py:selenium-wheel //py:selenium-sdist

  docs:
    name: Documentation
    needs: build
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout source tree
        uses: actions/checkout@v3
      - name: Set up Python 3.8
        uses: MatteoH2O1999/setup-python@v4
        with:
          python-version: 3.8
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox==4.6.4
      - name: Test with tox
        run: tox -c py/tox.ini
        env:
          TOXENV: docs

  lint:
    name: Lint
    needs: build
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout source tree
        uses: actions/checkout@v3
      - name: Set up Python 3.8
        uses: MatteoH2O1999/setup-python@v4
        with:
          python-version: 3.8
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox==4.6.4
      - name: Test with tox
        run: tox -c py/tox.ini
        env:
          # If this fails, it will exit. Local work should be using `tox -e linting` prior to committing.
          # the linting-ci recipe exists solely for CI and will not attempt to rewrite any files in-place etc.
          TOXENV: linting-ci

  mypy:
    name: Mypy
    needs: build
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout source tree
        uses: actions/checkout@v3
      - name: Set up Python 3.8
        uses: MatteoH2O1999/setup-python@v4
        with:
          python-version: 3.8
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox==4.6.4
      - name: Test with tox
        run: |
          tox -c py/tox.ini -- --cobertura-xml-report ci || true
          bash <(curl -s https://codecov.io/bash) -f py/ci/cobertura.xml
        env:
          TOXENV: mypy

  unit-tests:
    name: Unit Tests
    needs: build
    uses: ./.github/workflows/bazel.yml
    with:
      name: Unit Tests
      cache-key: py-unit
      run: bazel test //py:unit

  browser-tests:
    name: Browser Tests
    needs: build
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            browser-version: "stable"
          - browser: chrome
            browser-version: "118.0.5979.0"
          - browser: firefox
            browser-version: "110.0"
          - browser: firefox
            browser-version: "latest"
    with:
      name: Integration Tests (${{ matrix.browser }} - ${{ matrix.browser-version }})
      browser: ${{ matrix.browser }}
      browser-version: ${{ matrix.browser-version }}
      cache-key: py-${{ matrix.browser }}
      run: bazel test --flaky_test_attempts 3 //py:test-${{ matrix.browser }}

  remote-tests:
    name: Remote Tests
    needs: build
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser-version: "110.0"
          - browser-version: "latest"
    with:
      name: Integration Tests (remote - ${{ matrix.browser-version }})
      browser: firefox
      browser-version: ${{ matrix.browser-version }}
      cache-key: py-remote
      run: bazel test --local_test_jobs 1 --flaky_test_attempts 3 //py:test-remote
